<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fbf1c7">
<title>挙上log</title>
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon-180.png">
<!-- 配色はチラつかないよう、CSS を読む前に決める -->
<script>document.documentElement.dataset.theme = localStorage.getItem('owa-theme') || 'gruvbox';</script>
<link rel="stylesheet" href="styles.css">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- 見出し用フォントは「挙上log」の6文字だけに絞って読む -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&text=%E6%8C%99%E4%B8%8Alog&display=swap">
<script defer src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
</head>
<body>
<header>
  <h1><a class="brand" href="#/"><img src="icon.svg" alt="" width="28" height="28">挙上log</a></h1>
  <div class="header-actions">
    <div id="themes" class="themes" role="group" aria-label="配色"></div>
    <button type="button" id="minimize" hidden>最小化</button>
  </div>
</header>
<main id="app"></main>
<p id="status" role="status"></p>
<script type="module" src="app.js"></script>
</body>
</html>
