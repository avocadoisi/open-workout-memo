<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>筋トレメモ</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <h1>筋トレメモ</h1>
</header>
<main>
  <section>
    <h2>セットを記録</h2>
    <form id="set-form">
      <label>日付
        <input type="date" id="set-date" required>
      </label>
      <label>種目
        <select id="set-exercise" required></select>
      </label>
      <label>重量 (kg)
        <input type="number" id="set-weight" min="0" step="0.5" inputmode="decimal" required>
      </label>
      <label>回数
        <input type="number" id="set-reps" min="1" step="1" inputmode="numeric" required>
      </label>
      <label>メモ
        <input type="text" id="set-memo" maxlength="200">
      </label>
      <button type="submit">保存</button>
    </form>
  </section>

  <section>
    <h2>記録</h2>
    <label>日付
      <input type="date" id="list-date">
    </label>
    <p id="set-count"></p>
    <div id="set-list"></div>
  </section>

  <section>
    <h2>種目</h2>
    <form id="exercise-form">
      <label>名前
        <input type="text" id="exercise-name" maxlength="50" required>
      </label>
      <label>部位
        <input type="text" id="exercise-part" maxlength="50" required>
      </label>
      <button type="submit">追加</button>
    </form>
    <ul id="exercise-list"></ul>
  </section>

  <section>
    <h2>指標</h2>
    <form id="metric-def-form">
      <label>指標名
        <input type="text" id="metric-name" maxlength="50" required>
      </label>
      <label>単位
        <select id="metric-unit">
          <option value="weight">重さ (kg)</option>
          <option value="length">長さ (cm)</option>
        </select>
      </label>
      <button type="submit">指標を追加</button>
    </form>
    <form id="metric-log-form">
      <label>指標
        <select id="metric-select"></select>
      </label>
      <label>日付
        <input type="date" id="metric-date">
      </label>
      <label>値
        <input type="number" id="metric-value" step="0.1" inputmode="decimal">
      </label>
      <button type="submit">記録</button>
    </form>
    <ul id="metric-log-list"></ul>
  </section>

  <section>
    <h2>データ</h2>
    <button type="button" id="export-btn">エクスポート</button>
    <label>インポート（全置換）
      <input type="file" id="import-file" accept="application/json,.json">
    </label>
  </section>

  <p id="status" role="status"></p>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
